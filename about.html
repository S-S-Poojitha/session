<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Image Fill Example</title>
    <style>
        body {
            background-color: black; /* Set background color to black */
            color: white; /* Set text color to white for contrast */
            font-family: Arial, sans-serif; /* Set a default font */
            margin: 0;
            height: 100vh; /* Set height to full viewport height */
        }

        .container {
            display: flex; /* Use Flexbox for layout */
            height: 100%; /* Make container fill the full height of the body */
        }

        .column {
            flex: 1; /* Each column takes equal space */
            padding: 10px;
        }

        .column-1 {
            flex: 0 0 50%; /* First column takes 50% of the width */
            display: flex;
            flex-direction: column; /* Stack children vertically */
        }

        .column-2 {
            flex: 0 0 50%; /* Second column takes 50% of the width */
            display: flex;
            flex-direction: column; /* Stack rows vertically */
        }

        .row {
            flex: 1; /* Each row takes equal space within the second column */
            display: flex; /* Use Flexbox for images */
            justify-content: center; /* Center images horizontally */
            align-items: center; /* Center images vertically */
            margin-bottom: 10px; /* Space between rows */
        }

        .image {
            width: 100%; /* Make images responsive */
            height: 100%; /* Fill the height of the row */
            object-fit: cover; /* Cover the entire area without distortion */
        }

        .back-link {
            color: white;
            text-decoration: none;
            margin-top: 20px;
            font-size: 16px;
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .back-link:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="column column-1">
            <h1>Welcome to Bhutan</h1>
            <p>Bhutan is a small kingdom nestled in the Himalayas, known for its stunning landscapes and rich culture...</p>
            <a href="index.html" class="back-link">Back to Home</a>
        </div>
        <div class="column column-2">
            <div class="row">
                <img src="https://www.holidify.com/images/cmsuploads/compressed/culture1_20180920080134.jpg" alt="Image 1" class="image">
            </div>
            <div class="row">
                <img src="https://media-cdn.tripadvisor.com/media/photo-s/11/3e/05/86/tashichho-dzong-it-was.jpg" alt="Image 2" class="image">
            </div>
        </div>
    </div>
</body>
</html>
